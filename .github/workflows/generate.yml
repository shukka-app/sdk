# Regenerates every SDK from a published Shukka contract.
#
# Triggered by shukka's release workflow (repository_dispatch `shukka-release`)
# or manually. The spec is pulled from a URL, every generator runs, and any
# difference becomes a pull request — the generated code is committed, so a
# diff is the signal that the contract moved.
name: generate

on:
  repository_dispatch:
    types: [shukka-release]
  workflow_dispatch:
    inputs:
      spec_base_url:
        description: Base URL holding openapi.json and openapi.v3.0.json
        required: false
        default: https://raw.githubusercontent.com/shukka-app/shukka/main/apps/docs/public

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHUKKA_SPEC_URL: ${{ github.event.client_payload.spec_base_url || github.event.inputs.spec_base_url || 'https://raw.githubusercontent.com/shukka-app/shukka/main/apps/docs/public' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - run: pnpm install --frozen-lockfile

      - name: Fetch the contract
        run: node scripts/fetch-spec.mjs

      - name: Regenerate every language
        run: node scripts/generate.mjs

      - name: Ignore the toolchain-specific Package.resolved rewrite
        # SwiftPM recomputes `originHash` on a different toolchain even when no
        # dependency moved. Restore the committed file so drift means generated
        # code, not a lockfile rewrite.
        run: git checkout -- packages/swift/Package.resolved

      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff: the release did not change the contract."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      # The organization blocks GITHUB_TOKEN from creating pull requests, so
      # this pushes a reviewable branch instead and prints the compare URL.
      - name: Push the regenerated branch
        if: steps.drift.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B regenerate/openapi
          git add -A
          git commit -m 'chore: regenerate SDKs from the contract'
          git push --force origin regenerate/openapi

      - name: Point at the diff
        if: steps.drift.outputs.changed == 'true'
        run: |
          echo "::notice::Compare and open a PR: ${{ github.server_url }}/${{ github.repository }}/compare/main...regenerate/openapi"

      - name: Upload generated output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            packages
            spec
          retention-days: 3
