# Regenerates every SDK from a published Shukka contract.
#
# Triggered by shukka's release workflow (repository_dispatch `shukka-release`)
# or manually. The spec is pulled from a URL, every generator runs, and any
# difference becomes a pull request — the generated code is committed, so a
# diff is the signal that the contract moved.
name: generate

on:
  repository_dispatch:
    types: [shukka-release]
  workflow_dispatch:
    inputs:
      spec_base_url:
        description: Base URL holding openapi.json and openapi.v3.0.json
        required: false
        default: https://shukka.akr.moe
      create_pr:
        description: Open a pull request when generation changes files
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    name: Regenerate and open a PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHUKKA_SPEC_URL: ${{ github.event.client_payload.spec_base_url || github.event.inputs.spec_base_url || 'https://shukka.akr.moe' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - run: pnpm install --frozen-lockfile

      - name: Fetch the contract
        run: node scripts/fetch-spec.mjs

      - name: Regenerate every language
        run: node scripts/generate.mjs

      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff: the release did not change the contract."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Open a pull request
        if: steps.drift.outputs.changed == 'true' && (github.event_name == 'repository_dispatch' || inputs.create_pr)
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: regenerate SDKs from the contract'
          title: 'chore: regenerate SDKs from the contract'
          body: |
            Regenerated from `${{ env.SHUKKA_SPEC_URL }}`.

            `spec/openapi.lock.json` records the sha256 of both snapshots.
            Review the model/method diff before merging — a renamed
            `operationId` is a breaking change in every language.
          branch: regenerate/openapi
          delete-branch: true
          add-paths: |
            spec
            packages
            pnpm-lock.yaml

      - name: Upload generated output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated
          path: |
            packages
            spec
          retention-days: 3
