# Runs every generated SDK against a real Shukka instance.
#
# The runtime image is built from the shukka repository, not pulled from GHCR:
# the package is not public, and building from the same ref the contract came
# from is the point of the test. Pass `shukka_image` to reuse a prebuilt image.
#
# The stack is thrown away afterwards: docker-compose.contract.yml starts
# Shukka + MinIO, provision.mjs creates an app and a key, publish.mjs uploads
# one Tauri release, and each language runner reads it back through its own
# generated client.
name: contract

on:
  workflow_dispatch:
    inputs:
      shukka_ref:
        description: shukka ref to build the runtime image from
        required: false
        default: main
      shukka_image:
        description: Prebuilt image to use instead of building
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'packages/**'
      - 'tests/contract/**'
      - 'scripts/**'
      - 'docker-compose.contract.yml'
      - '.github/workflows/contract.yml'
  pull_request:
    paths:
      - 'spec/**'
      - 'packages/**'
      - 'tests/contract/**'
      - 'scripts/**'
      - 'docker-compose.contract.yml'
      - '.github/workflows/contract.yml'
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Generated clients vs a live Shukka
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the SDK
        uses: actions/checkout@v4

      - name: Check out shukka
        if: inputs.shukka_image == ''
        uses: actions/checkout@v4
        with:
          repository: shukka-app/shukka
          ref: ${{ inputs.shukka_ref || 'main' }}
          path: .shukka

      - name: Build the runtime image
        if: inputs.shukka_image == ''
        run: docker build -t shukka-contract:ci -f .shukka/apps/shukka/Dockerfile .shukka

      - name: Choose the runtime image
        run: |
          IMAGE="${{ inputs.shukka_image }}"
          if [ -z "$IMAGE" ]; then IMAGE="shukka-contract:ci"; fi
          echo "SHUKKA_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - run: pnpm install --frozen-lockfile

      - name: Start the stack, publish a release, run every runner
        run: node scripts/test-contract.mjs
