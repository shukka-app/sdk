# Checks what each registry would receive, then publishes every package from a
# tag through the registry's trusted publishing (OIDC, no long-lived token).
#
# npm, pub.dev and crates.io each accept a trusted publisher only after the
# package's first, hand-published version exists — see TODO.md for the bootstrap.
name: publish

on:
  push:
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only run the registry dry runs
        type: boolean
        default: true
      version:
        description: Version to publish (required when dry_run is false)
        required: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Registry dry runs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'

      - run: pnpm install --frozen-lockfile

      - name: npm, pub.dev, crates.io, SwiftPM
        run: node scripts/test-publish.mjs

  npm:
    name: Publish @shukka/sdk (trusted publishing)
    needs: verify
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs a recent npm; it exchanges the GitHub OIDC
      # token for a short-lived publish credential. 11.15 is the first release
      # with `npm trust`, which is how the trusted publisher gets registered.
      - run: npm install --global 'npm@^11.15.0'
      - run: pnpm install --frozen-lockfile

      - name: Resolve the version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "A version is required when publishing without a tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Write the version into every package
        run: node scripts/set-version.mjs "${{ steps.version.outputs.version }}"

      - run: pnpm --filter @shukka/sdk build

      - name: Publish with provenance
        working-directory: packages/typescript
        run: npm publish --provenance --access public

  pubdev:
    name: Publish shukka_sdk (trusted publishing)
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # setup-dart mints the OIDC token and stores it for `dart pub publish`.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.9'

      - name: Write the version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - run: dart pub get
        working-directory: packages/dart

      - name: Publish
        working-directory: packages/dart
        run: dart pub publish --force

  crates:
    name: Publish shukka (trusted publishing)
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      # Exchanges the GitHub OIDC token for a crates.io token that lasts one hour.
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Write the version from the tag
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Publish
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --allow-dirty
