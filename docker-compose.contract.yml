# Throwaway Shukka instance for the contract tests.
#
#   docker compose -f docker-compose.contract.yml up -d
#   docker compose -f docker-compose.contract.yml run --rm publisher /contract/provision.mjs
#   docker compose -f docker-compose.contract.yml down -v
#
# `scripts/test-contract.mjs` drives all of this, waits for health, and tears the
# stack down. The `publisher` service exists because presigned URLs are signed
# for the `s3` hostname: provisioning and publishing must run inside the compose
# network, while the language runners run on the host against :3000.
#
# The object store is s3proxy rather than MinIO: MinIO's published images are no
# longer pullable anonymously (quay.io returns unauthorized for the CI runner),
# and all this stack needs is an S3 endpoint that validates SigV4.
name: shukka-sdk-contract

services:
  s3:
    image: andrewgaul/s3proxy:latest
    environment:
      S3PROXY_ENDPOINT: http://0.0.0.0:9000
      S3PROXY_AUTHORIZATION: aws-v4
      S3PROXY_IDENTITY: ${S3_ACCESS_KEY:-shukka}
      S3PROXY_CREDENTIAL: ${S3_SECRET_KEY:-shukkasecret}
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    ports:
      - '9000:9000'
    volumes:
      - s3-data:/data

  shukka:
    image: ${SHUKKA_IMAGE:-ghcr.io/shukka-app/shukka:latest}
    ports:
      - '${SHUKKA_CONTRACT_PORT:-3000}:3000'
    volumes:
      - shukka-data:/data
    depends_on:
      - s3

  publisher:
    image: node:24-alpine
    profiles: ['tools']
    working_dir: /contract
    entrypoint: ['node']
    environment:
      SHUKKA_URL: http://shukka:3000
      S3_URL: http://s3:9000
      S3_BUCKET: ${S3_BUCKET:-releases}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shukka}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shukkasecret}
      SHUKKA_APP: ${SHUKKA_CONTRACT_APP:-shukka-contract-ci}
      SHUKKA_CONTRACT_CHANNEL: ${SHUKKA_CONTRACT_CHANNEL:-stable}
      SHUKKA_CONTRACT_VERSION: ${SHUKKA_CONTRACT_VERSION:-1.2.3}
    volumes:
      - ./scripts/contract:/contract:ro
    depends_on:
      - shukka
      - s3

volumes:
  s3-data:
  shukka-data:
